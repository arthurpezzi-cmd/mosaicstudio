<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mosaic studio — gerador de texturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Bodoni+Moda:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --panel:#0a0a0a;
    --line:#262626;
    --line-soft:#1a1a1a;
    --ink:#f5f5f0;
    --ink-dim:#8a8a85;
    --ink-faint:#4a4a46;
    --accent:#f5f5f0;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Bricolage Grotesque', system-ui, sans-serif;
    color-scheme:dark;
  }
  body{
    display:flex;
    min-height:100vh;
  }

  /* ---------- sidebar ---------- */
  .panel{
    width:340px;
    flex:0 0 340px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:36px 28px 28px;
    display:flex;
    flex-direction:column;
    gap:26px;
    overflow-y:auto;
    max-height:100vh;
  }
  .brand h1{
    margin:0;
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1;
  }
  .brand h1 em{
    font-family:'Bodoni Moda', 'Times New Roman', serif;
    font-style:italic;
    font-weight:500;
    color:var(--ink-dim);
    margin-left:7px;
    letter-spacing:0;
  }
  .brand p{
    margin:10px 0 0;
    font-size:13px;
    line-height:1.5;
    color:var(--ink-dim);
    max-width:34ch;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .field label{
    font-size:12px;
    color:var(--ink-dim);
    display:flex;
    justify-content:space-between;
    gap:8px;
  }
  .field label span{ color:var(--ink); }

  .dropzone{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    height:96px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    font-size:13px;
    color:var(--ink-dim);
    cursor:pointer;
    padding:12px;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .dropzone:hover,
  .dropzone.drag{
    border-color:var(--ink);
    color:var(--ink);
    background:rgba(255,255,255,0.03);
  }
  .dropzone.has-file{
    border-style:solid;
    color:var(--ink);
  }

  select, input[type="range"], input[type="color"]{
    width:100%;
    accent-color:var(--ink);
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background-color:#161616;
    border:1px solid #55554f;
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    padding:11px 34px 11px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    background-image:linear-gradient(45deg, transparent 50%, var(--ink) 50%),
                      linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position:calc(100% - 18px) center, calc(100% - 13px) center;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
    transition:border-color .15s ease, background-color .15s ease;
  }
  select:hover{
    border-color:#8a8a85;
    background-color:#1c1c1c;
  }
  select option{
    background-color:#161616;
    color:var(--ink);
  }
  select:focus, input:focus{
    outline:1px solid var(--ink);
    outline-offset:2px;
  }
  select:focus{
    border-color:var(--ink);
  }

  input[type="range"]{
    -webkit-appearance:none;
    height:2px;
    background:var(--line);
    border-radius:2px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--ink);
    cursor:pointer;
    margin-top:-5px;
  }
  input[type="range"]::-moz-range-thumb{
    width:12px;
    height:12px;
    border:none;
    border-radius:50%;
    background:var(--ink);
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{ height:2px; background:var(--line); }
  input[type="range"]::-moz-range-track{ height:2px; background:var(--line); }

  input[type="color"]{
    -webkit-appearance:none;
    height:34px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:transparent;
    padding:2px;
    cursor:pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper{ padding:0; }
  input[type="color"]::-webkit-color-swatch{ border:none; border-radius:1px; }

  fieldset{
    border:none;
    margin:0;
    padding:16px 0 0;
    display:flex;
    flex-direction:column;
    gap:16px;
    border-top:1px solid var(--line-soft);
  }

  .divider{
    height:1px;
    background:var(--line-soft);
    margin:2px 0;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:4px;
  }
  button{
    font-family:inherit;
    font-size:13px;
    padding:12px 14px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:var(--radius);
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  button:hover:not(:disabled){
    background:var(--ink);
    color:#000;
    border-color:var(--ink);
  }
  button:disabled{
    color:var(--ink-faint);
    border-color:var(--line-soft);
    cursor:not-allowed;
  }
  button.primary{
    background:var(--ink);
    color:#000;
    border-color:var(--ink);
  }
  button.primary:hover:not(:disabled){
    background:transparent;
    color:var(--ink);
  }

  .status{
    margin:0;
    font-size:11.5px;
    color:var(--ink-faint);
    letter-spacing:0.01em;
  }

  /* ---------- stage ---------- */
  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px;
    position:relative;
  }
  .canvasWrap{
    position:relative;
    max-width:100%;
    max-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #outputCanvas{
    display:block;
    max-width:70vw;
    max-height:78vh;
    image-rendering:auto;
  }
  #outputCanvas.hidden{ display:none; }

  .emptyState{
    text-align:center;
    color:var(--ink-faint);
    font-size:14px;
    max-width:320px;
    line-height:1.6;
  }
  .emptyState span{
    display:block;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--ink-dim);
    margin-top:8px;
  }

  .starIcon{
    width:34px;
    height:34px;
    margin:0 auto 18px;
    opacity:0.5;
  }

  @media (max-width: 860px){
    body{ flex-direction:column; }
    .panel{
      width:100%;
      flex:none;
      max-height:none;
      border-right:none;
      border-bottom:1px solid var(--line);
    }
    #outputCanvas{ max-width:90vw; }
  }
</style>
</head>
<body>

  <aside class="panel">
    <div class="brand">
      <h1>mosaic<em>studio</em></h1>
      <p>envie um ícone sólido e transforme-o em um mosaico de formas geométricas repetidas.</p>
    </div>

    <div class="field">
      <label for="fileInput">imagem</label>
      <label class="dropzone" id="dropzone" for="fileInput">
        <span id="dropzoneText">clique ou arraste um .png / .svg</span>
      </label>
      <input type="file" id="fileInput" accept=".png,.svg,image/png,image/svg+xml" hidden>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="shapeSelect">forma</label>
      <select id="shapeSelect">
        <option value="cross">cruz</option>
        <option value="xcross">cruz diagonal</option>
        <option value="circle">círculo</option>
        <option value="ring">anel</option>
        <option value="triangle">triângulo</option>
        <option value="square">quadrado</option>
        <option value="diamond">losango</option>
        <option value="hexagon">hexágono</option>
        <option value="octagon">octógono</option>
        <option value="star">estrela</option>
      </select>
    </div>

    <fieldset id="starFields" hidden>
      <div class="field">
        <label for="starPoints">número de pontas <span id="starPointsVal">5</span></label>
        <input type="range" id="starPoints" min="3" max="16" value="5" step="1">
      </div>
      <div class="field">
        <label for="starSpike">tamanho das pontas <span id="starSpikeVal">0.45</span></label>
        <input type="range" id="starSpike" min="0.10" max="0.85" value="0.45" step="0.01">
      </div>
    </fieldset>

    <fieldset id="ringFields" hidden>
      <div class="field">
        <label for="ringThickness">espessura do anel <span id="ringThicknessVal">0.55</span></label>
        <input type="range" id="ringThickness" min="0.15" max="0.85" value="0.55" step="0.01">
      </div>
    </fieldset>

    <div class="field">
      <label for="spacing">espaçamento / densidade <span id="spacingVal">10px</span></label>
      <input type="range" id="spacing" min="4" max="40" value="10" step="1">
    </div>

    <div class="field">
      <label for="shapeScale">tamanho da forma <span id="shapeScaleVal">80%</span></label>
      <input type="range" id="shapeScale" min="15" max="100" value="80" step="1">
    </div>

    <div class="field">
      <label for="threshold">sensibilidade <span id="thresholdVal">128</span></label>
      <input type="range" id="threshold" min="10" max="250" value="128" step="1">
    </div>

    <div class="field">
      <label for="shapeColor">cor da forma</label>
      <input type="color" id="shapeColor" value="#f5f5f0">
    </div>

    <div class="divider"></div>

    <div class="actions">
      <button id="downloadPng" class="primary" disabled>baixar .png</button>
      <button id="downloadSvg" disabled>baixar .svg</button>
    </div>

    <p class="status" id="status">aguardando upload...</p>
  </aside>

  <main class="stage">
    <div class="canvasWrap">
      <canvas id="outputCanvas" class="hidden"></canvas>
      <div class="emptyState" id="emptyState">
        <svg class="starIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1 L14.5 9.5 L23 12 L14.5 14.5 L12 23 L9.5 14.5 L1 12 L9.5 9.5 Z" fill="#f5f5f0"/>
        </svg>
        <p>envie um ícone para começar</p>
        <span>png ou svg, fundo transparente funciona melhor</span>
      </div>
    </div>
  </main>

<script>
(function(){
  "use strict";

  // ---------- constants ----------
  var MAX_DIM = 640;      // processing resolution cap, keeps getImageData fast
  var EXPORT_SCALE = 2;   // supersample factor for crisper PNG export

  // ---------- dom ----------
  var fileInput   = document.getElementById('fileInput');
  var dropzone    = document.getElementById('dropzone');
  var dropzoneText= document.getElementById('dropzoneText');
  var shapeSelect = document.getElementById('shapeSelect');
  var starFields  = document.getElementById('starFields');
  var starPoints  = document.getElementById('starPoints');
  var starPointsVal = document.getElementById('starPointsVal');
  var starSpike   = document.getElementById('starSpike');
  var starSpikeVal= document.getElementById('starSpikeVal');
  var ringFields  = document.getElementById('ringFields');
  var ringThickness = document.getElementById('ringThickness');
  var ringThicknessVal = document.getElementById('ringThicknessVal');
  var spacing     = document.getElementById('spacing');
  var spacingVal  = document.getElementById('spacingVal');
  var shapeScale  = document.getElementById('shapeScale');
  var shapeScaleVal = document.getElementById('shapeScaleVal');
  var threshold   = document.getElementById('threshold');
  var thresholdVal= document.getElementById('thresholdVal');
  var shapeColor  = document.getElementById('shapeColor');
  var downloadPngBtn = document.getElementById('downloadPng');
  var downloadSvgBtn = document.getElementById('downloadSvg');
  var statusEl    = document.getElementById('status');
  var canvas      = document.getElementById('outputCanvas');
  var ctx         = canvas.getContext('2d');
  var emptyState  = document.getElementById('emptyState');

  // ---------- state ----------
  var srcImageData = null;   // ImageData of the (downscaled) source image
  var offW = 0, offH = 0;    // processing resolution
  var currentShapes = [];    // last generated list of {cx, cy}
  var hasImage = false;

  function setStatus(msg){ statusEl.textContent = msg; }

  // ---------- upload handling ----------
  dropzone.addEventListener('click', function(){ fileInput.click(); });
  dropzone.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') fileInput.click();
  });
  ['dragenter','dragover'].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.add('drag');
    });
  });
  ['dragleave','drop'].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.remove('drag');
    });
  });
  dropzone.addEventListener('drop', function(e){
    var files = e.dataTransfer.files;
    if (files && files.length) handleFile(files[0]);
  });
  fileInput.addEventListener('change', function(e){
    if (e.target.files && e.target.files.length) handleFile(e.target.files[0]);
  });

  function handleFile(file){
    var isPng = /image\/png/.test(file.type) || /\.png$/i.test(file.name);
    var isSvg = /image\/svg/.test(file.type) || /\.svg$/i.test(file.name);
    if (!isPng && !isSvg){
      setStatus('formato não suportado — use .png ou .svg');
      return;
    }
    setStatus('carregando imagem...');
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      loadImageIntoProcessor(img);
      URL.revokeObjectURL(url);
      dropzoneText.textContent = file.name;
      dropzone.classList.add('has-file');
    };
    img.onerror = function(){
      setStatus('não foi possível ler esse arquivo');
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  function loadImageIntoProcessor(img){
    var natW = img.naturalWidth || img.width || 512;
    var natH = img.naturalHeight || img.height || 512;
    var scale = Math.min(1, MAX_DIM / Math.max(natW, natH));
    offW = Math.max(1, Math.round(natW * scale));
    offH = Math.max(1, Math.round(natH * scale));

    var off = document.createElement('canvas');
    off.width = offW;
    off.height = offH;
    var octx = off.getContext('2d');
    octx.clearRect(0, 0, offW, offH);
    octx.drawImage(img, 0, 0, offW, offH);

    try{
      srcImageData = octx.getImageData(0, 0, offW, offH);
    }catch(err){
      setStatus('erro ao ler pixels da imagem (CORS?)');
      return;
    }

    hasImage = true;
    downloadPngBtn.disabled = false;
    downloadSvgBtn.disabled = false;
    canvas.classList.remove('hidden');
    emptyState.style.display = 'none';
    generateMosaic();
  }

  // ---------- shape geometry ----------
  // returns a descriptor: {kind:'polygon', points:[[x,y],...]}, {kind:'circle', cx, cy, r}
  // or {kind:'ring', cx, cy, outerR, innerR}

  function regularPolygonPoints(cx, cy, r, sides, rotationDeg){
    var pts = [];
    var rot = (rotationDeg || 0) * Math.PI / 180;
    for (var i = 0; i < sides; i++){
      var angle = rot + (Math.PI * 2 / sides) * i;
      pts.push([ cx + r * Math.cos(angle), cy + r * Math.sin(angle) ]);
    }
    return pts;
  }

  function rotatePoints(points, cx, cy, deg){
    var rad = deg * Math.PI / 180;
    var cos = Math.cos(rad), sin = Math.sin(rad);
    return points.map(function(p){
      var dx = p[0] - cx, dy = p[1] - cy;
      return [ cx + dx * cos - dy * sin, cy + dx * sin + dy * cos ];
    });
  }

  function crossPoints(cx, cy, size){
    var s = size;
    var t = size * 0.38; // arm half-thickness
    return [
      [cx - t, cy - s], [cx + t, cy - s],
      [cx + t, cy - t], [cx + s, cy - t],
      [cx + s, cy + t], [cx + t, cy + t],
      [cx + t, cy + s], [cx - t, cy + s],
      [cx - t, cy + t], [cx - s, cy + t],
      [cx - s, cy - t], [cx - t, cy - t]
    ];
  }

  function getShapeGeometry(type, cx, cy, size, opts){
    switch (type){
      case 'circle':
        return { kind:'circle', cx:cx, cy:cy, r:size };

      case 'ring':
        return { kind:'ring', cx:cx, cy:cy, outerR:size, innerR: size * (1 - opts.ringThickness) };

      case 'triangle':
        return { kind:'polygon', points: regularPolygonPoints(cx, cy, size, 3, -90) };

      case 'square':
        return { kind:'polygon', points: regularPolygonPoints(cx, cy, size, 4, 45) };

      case 'diamond':
        return { kind:'polygon', points: regularPolygonPoints(cx, cy, size, 4, 0) };

      case 'hexagon':
        return { kind:'polygon', points: regularPolygonPoints(cx, cy, size, 6, 0) };

      case 'octagon':
        return { kind:'polygon', points: regularPolygonPoints(cx, cy, size, 8, 22.5) };

      case 'xcross':
        return { kind:'polygon', points: rotatePoints(crossPoints(cx, cy, size), cx, cy, 45) };

      case 'star':
        var n = opts.starPoints;
        var outerR = size;
        var innerR = size * opts.starSpike;
        var starPts = [];
        for (var i2 = 0; i2 < n * 2; i2++){
          var ang = (Math.PI / n) * i2 - Math.PI / 2;
          var r = (i2 % 2 === 0) ? outerR : innerR;
          starPts.push([ cx + r * Math.cos(ang), cy + r * Math.sin(ang) ]);
        }
        return { kind:'polygon', points: starPts };

      case 'cross':
      default:
        return { kind:'polygon', points: crossPoints(cx, cy, size) };
    }
  }

  function drawGeometry(ctx2, geo){
    ctx2.beginPath();
    if (geo.kind === 'circle'){
      ctx2.arc(geo.cx, geo.cy, geo.r, 0, Math.PI * 2);
      ctx2.fill();
      return;
    }
    if (geo.kind === 'ring'){
      ctx2.arc(geo.cx, geo.cy, geo.outerR, 0, Math.PI * 2);
      ctx2.moveTo(geo.cx + geo.innerR, geo.cy);
      ctx2.arc(geo.cx, geo.cy, geo.innerR, 0, Math.PI * 2, true);
      ctx2.fill('evenodd');
      return;
    }
    geo.points.forEach(function(p, i){
      if (i === 0) ctx2.moveTo(p[0], p[1]);
      else ctx2.lineTo(p[0], p[1]);
    });
    ctx2.closePath();
    ctx2.fill();
  }

  // ---------- sampling + generation ----------
  function isFilledPixel(x, y, lumThreshold){
    var xi = Math.min(offW - 1, Math.max(0, Math.floor(x)));
    var yi = Math.min(offH - 1, Math.max(0, Math.floor(y)));
    var idx = (yi * offW + xi) * 4;
    var data = srcImageData.data;
    var r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
    if (a < 20) return false;
    var lum = 0.299 * r + 0.587 * g + 0.114 * b;
    return lum < lumThreshold;
  }

  function generateMosaic(){
    if (!hasImage) return;

    var type = shapeSelect.value;
    var spacingPx = parseFloat(spacing.value);
    var scalePct = parseFloat(shapeScale.value) / 100;
    var lumThreshold = parseFloat(threshold.value);
    var opts = {
      starPoints: parseInt(starPoints.value, 10),
      starSpike: parseFloat(starSpike.value),
      ringThickness: parseFloat(ringThickness.value)
    };
    var size = (spacingPx * scalePct) / 2;

    var shapes = [];
    var cols = Math.ceil(offW / spacingPx);
    var rows = Math.ceil(offH / spacingPx);

    for (var row = 0; row < rows; row++){
      var cy = row * spacingPx + spacingPx / 2;
      if (cy >= offH) continue;
      for (var col = 0; col < cols; col++){
        var cx = col * spacingPx + spacingPx / 2;
        if (cx >= offW) continue;
        if (isFilledPixel(cx, cy, lumThreshold)){
          shapes.push([cx, cy]);
        }
      }
    }

    currentShapes = shapes;
    renderCanvas(type, size, opts);
    setStatus(shapes.length + ' formas geradas · ' + offW + '×' + offH + 'px');
  }

  function renderCanvas(type, size, opts){
    canvas.width = offW * EXPORT_SCALE;
    canvas.height = offH * EXPORT_SCALE;
    canvas.style.width = offW + 'px';
    canvas.style.height = offH + 'px';

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.scale(EXPORT_SCALE, EXPORT_SCALE);
    ctx.fillStyle = shapeColor.value;

    for (var i = 0; i < currentShapes.length; i++){
      var cx = currentShapes[i][0];
      var cy = currentShapes[i][1];
      var geo = getShapeGeometry(type, cx, cy, size, opts);
      drawGeometry(ctx, geo);
    }
  }

  function rerender(){
    if (!hasImage) return;
    generateMosaic();
  }

  // ---------- svg export ----------
  function buildSVG(){
    var type = shapeSelect.value;
    var spacingPx = parseFloat(spacing.value);
    var scalePct = parseFloat(shapeScale.value) / 100;
    var size = (spacingPx * scalePct) / 2;
    var opts = {
      starPoints: parseInt(starPoints.value, 10),
      starSpike: parseFloat(starSpike.value),
      ringThickness: parseFloat(ringThickness.value)
    };
    var color = shapeColor.value;

    var parts = [];
    parts.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + offW + ' ' + offH + '" width="' + offW + '" height="' + offH + '">');
    parts.push('<g fill="' + color + '">');

    for (var i = 0; i < currentShapes.length; i++){
      var cx = currentShapes[i][0];
      var cy = currentShapes[i][1];
      var geo = getShapeGeometry(type, cx, cy, size, opts);
      if (geo.kind === 'circle'){
        parts.push('<circle cx="' + round2(geo.cx) + '" cy="' + round2(geo.cy) + '" r="' + round2(geo.r) + '"/>');
      } else if (geo.kind === 'ring'){
        parts.push('<path fill-rule="evenodd" d="' + ringPathData(geo) + '"/>');
      } else {
        var pts = geo.points.map(function(p){ return round2(p[0]) + ',' + round2(p[1]); }).join(' ');
        parts.push('<polygon points="' + pts + '"/>');
      }
    }

    parts.push('</g>');
    parts.push('</svg>');
    return parts.join('');
  }

  function round2(n){ return Math.round(n * 100) / 100; }

  function ringPathData(geo){
    var cx = geo.cx, cy = geo.cy, ro = geo.outerR, ri = geo.innerR;
    return 'M ' + round2(cx + ro) + ' ' + round2(cy) +
      ' A ' + round2(ro) + ' ' + round2(ro) + ' 0 1 0 ' + round2(cx - ro) + ' ' + round2(cy) +
      ' A ' + round2(ro) + ' ' + round2(ro) + ' 0 1 0 ' + round2(cx + ro) + ' ' + round2(cy) +
      ' Z' +
      ' M ' + round2(cx + ri) + ' ' + round2(cy) +
      ' A ' + round2(ri) + ' ' + round2(ri) + ' 0 1 0 ' + round2(cx - ri) + ' ' + round2(cy) +
      ' A ' + round2(ri) + ' ' + round2(ri) + ' 0 1 0 ' + round2(cx + ri) + ' ' + round2(cy) +
      ' Z';
  }

  // ---------- downloads ----------
  function triggerDownload(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  downloadPngBtn.addEventListener('click', function(){
    if (!hasImage) return;
    canvas.toBlob(function(blob){
      if (blob) triggerDownload(blob, 'mosaico.png');
    }, 'image/png');
  });

  downloadSvgBtn.addEventListener('click', function(){
    if (!hasImage) return;
    var svgStr = buildSVG();
    var blob = new Blob([svgStr], { type: 'image/svg+xml' });
    triggerDownload(blob, 'mosaico.svg');
  });

  // ---------- control bindings ----------
  shapeSelect.addEventListener('change', function(){
    starFields.hidden = (shapeSelect.value !== 'star');
    ringFields.hidden = (shapeSelect.value !== 'ring');
    rerender();
  });

  starPoints.addEventListener('input', function(){
    starPointsVal.textContent = starPoints.value;
    rerender();
  });
  starSpike.addEventListener('input', function(){
    starSpikeVal.textContent = parseFloat(starSpike.value).toFixed(2);
    rerender();
  });
  ringThickness.addEventListener('input', function(){
    ringThicknessVal.textContent = parseFloat(ringThickness.value).toFixed(2);
    rerender();
  });
  spacing.addEventListener('input', function(){
    spacingVal.textContent = spacing.value + 'px';
    rerender();
  });
  shapeScale.addEventListener('input', function(){
    shapeScaleVal.textContent = shapeScale.value + '%';
    rerender();
  });
  threshold.addEventListener('input', function(){
    thresholdVal.textContent = threshold.value;
    rerender();
  });
  shapeColor.addEventListener('input', function(){
    if (!hasImage) return;
    var type = shapeSelect.value;
    var spacingPx = parseFloat(spacing.value);
    var scalePct = parseFloat(shapeScale.value) / 100;
    var size = (spacingPx * scalePct) / 2;
    var opts = {
      starPoints: parseInt(starPoints.value, 10),
      starSpike: parseFloat(starSpike.value)
    };
    renderCanvas(type, size, opts);
  });

})();
</script>
</body>
</html>
